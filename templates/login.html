<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Interview Practice Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page narrow">
    <header class="hero">
      <p class="eyebrow">PLACEMENT PRACTICE</p>
      <h1>Welcome back</h1>
      <p>Log in to continue your interview practice.</p>
    </header>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="notice {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <section class="card">
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
      </form>
      <p class="muted account-switch">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </section>
  </main>
</body>
</html>
